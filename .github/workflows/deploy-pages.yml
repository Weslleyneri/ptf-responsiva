name: Publicar portfólio no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Montar versão pública
        run: |
          mkdir -p _site/assets
          cp index.html script.js github-pages.css .nojekyll _site/
          cp assets/favicon.svg _site/assets/favicon.svg
          sed '/^@import /d' globals.css > _site/globals.css

      - name: Preparar site estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
